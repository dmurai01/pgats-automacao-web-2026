name: Automation Exercise - Trabalho Final

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - trabalho-de-conclusao-modulo

jobs:
  cypress:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run final automation exercise test
        run: npx cypress run --spec "cypress/e2e/1-getting-started/automation-exercise-trabalho-final.cy.js"

      - name: Upload Mochawesome report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-report
          path: cypress/reports/html/
          if-no-files-found: warn
